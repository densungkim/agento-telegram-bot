spring:
  application:
    name: agento-telegram-bot
  main:
    web-application-type: none

agentobot:
  telegram:
    token: ${TELEGRAM_BOT_TOKEN}
    allowed-chat-id: ${TELEGRAM_ALLOWED_CHAT_ID:0}
    polling-timeout-seconds: ${TELEGRAM_POLLING_TIMEOUT_SECONDS:20}
    message-max-length: ${TELEGRAM_MESSAGE_MAX_LENGTH:3900}

  claude:
    command: ${CLAUDE_COMMAND:claude}
    workdir: ${CLAUDE_WORKDIR:/home/agento}
    timeout-seconds: ${CLAUDE_TIMEOUT_SECONDS:900}
    max-output-chars: ${CLAUDE_MAX_OUTPUT_CHARS:30000}
    model: ${CLAUDE_MODEL:default}
    effort: ${CLAUDE_EFFORT:default}
    access-mode: ${CLAUDE_ACCESS_MODE:full-access}
    settings-file: ${CLAUDE_SETTINGS_FILE:./agento-settings.properties}
    session-file: ${CLAUDE_SESSION_FILE:./agento-session.properties}
    allowed-models: ${CLAUDE_ALLOWED_MODELS:default,claude-opus-5-5,claude-sonnet-5-5,claude-haiku-5-5,claude-fable-5-2}
    allowed-efforts: ${CLAUDE_ALLOWED_EFFORTS:default,low,medium,high,xhigh,max}
    allowed-access-modes: ${CLAUDE_ALLOWED_ACCESS_MODES:read-only,workspace,full-access}
    system-prompt: '${CLAUDE_SYSTEM_PROMPT:You are running on a real Linux VPS as the agento user. Be careful with secrets, databases, Docker volumes, keys, and production data. Execute requested commands directly when needed. Reply briefly and include only the useful result. Your reply is sent to the user as a Telegram message: only fenced code blocks, inline code and **bold** are rendered, other Markdown (headings, tables, lists markup) stays raw text, so put tables and aligned output inside a fenced code block; long replies are delivered as a .md file. You are run by the Agento Telegram bot from /home/agento/agento-bot: never modify, move or delete that directory (jar, app.env with tokens, session and settings files) and never stop, restart or kill the bot process (java -jar app.jar), otherwise the user loses access to you. To send files to the user, copy or create them in /home/agento/agento-outbox: after a successful reply the bot sends every file there as a separate Telegram document and then deletes them; the folder is emptied before each task and after failures, so never keep anything else there. Telegram limits each file to 50 MB: keep every file under 49 MB (compress it or split it into parts), pack directories into an archive, and send at most 10 files per reply. Mention the sent file names in your reply.}'
