name: Build and deploy Agento Bot

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Maven 3.9.16
        run: |
          set -euo pipefail
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz -o /tmp/apache-maven.tar.gz
          tar -xzf /tmp/apache-maven.tar.gz -C /tmp
          echo "/tmp/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"

      - name: Build jar
        run: |
          mvn -version
          mvn -B clean package -DskipTests

      - name: Prepare SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/agento_deploy_key
          chmod 600 ~/.ssh/agento_deploy_key

          if [ -z "${VPS_PORT:-}" ]; then
            VPS_PORT=22
          fi

          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Prepare deployment files
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
          CODEX_COMMAND: ${{ secrets.CODEX_COMMAND }}
          CODEX_WORKDIR: ${{ secrets.CODEX_WORKDIR }}
          CODEX_TIMEOUT_SECONDS: ${{ secrets.CODEX_TIMEOUT_SECONDS }}
          CODEX_MAX_OUTPUT_CHARS: ${{ secrets.CODEX_MAX_OUTPUT_CHARS }}
          CODEX_MODEL: ${{ secrets.CODEX_MODEL }}
          CODEX_REASONING_EFFORT: ${{ secrets.CODEX_REASONING_EFFORT }}
          CODEX_ACCESS_MODE: ${{ secrets.CODEX_ACCESS_MODE }}
          CODEX_SETTINGS_FILE: ${{ secrets.CODEX_SETTINGS_FILE }}
          CODEX_SYSTEM_PROMPT: ${{ secrets.CODEX_SYSTEM_PROMPT }}
        run: |
          set -euo pipefail
          mkdir -p deploy
          cp target/agento-telegram-bot-0.0.1-SNAPSHOT.jar deploy/app.jar
          cp scripts/agento-bot-status.sh deploy/agento-bot-status.sh
          cp scripts/agento-bot-stop.sh deploy/agento-bot-stop.sh

          : "${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN secret is required}"
          : "${TELEGRAM_ALLOWED_CHAT_ID:?TELEGRAM_ALLOWED_CHAT_ID secret is required}"

          : "${CODEX_COMMAND:=codex}"
          : "${CODEX_WORKDIR:=/home/agento}"
          : "${CODEX_TIMEOUT_SECONDS:=900}"
          : "${CODEX_MAX_OUTPUT_CHARS:=30000}"
          : "${CODEX_MODEL:=gpt-5.5}"
          : "${CODEX_REASONING_EFFORT:=medium}"
          : "${CODEX_ACCESS_MODE:=full-access}"
          : "${CODEX_SETTINGS_FILE:=./agento-settings.properties}"

          write_env() {
            local key="$1"
            local value="${!key:-}"
            printf '%s=%q\n' "$key" "$value" >> deploy/app.env
          }

          : > deploy/app.env
          write_env TELEGRAM_BOT_TOKEN
          write_env TELEGRAM_ALLOWED_CHAT_ID
          write_env CODEX_COMMAND
          write_env CODEX_WORKDIR
          write_env CODEX_TIMEOUT_SECONDS
          write_env CODEX_MAX_OUTPUT_CHARS
          write_env CODEX_MODEL
          write_env CODEX_REASONING_EFFORT
          write_env CODEX_ACCESS_MODE
          write_env CODEX_SETTINGS_FILE
          if [ -n "${CODEX_SYSTEM_PROMPT:-}" ]; then
            write_env CODEX_SYSTEM_PROMPT
          fi

          printf '%s=%q\n' CODEX_SKIP_GIT_REPO_CHECK true >> deploy/app.env

      - name: Copy files to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          : "${VPS_USER:=agento}"
          : "${VPS_PORT:=22}"
          : "${VPS_APP_DIR:=/home/agento/agento-bot}"

          ssh -i ~/.ssh/agento_deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_APP_DIR/.incoming' && rm -f '$VPS_APP_DIR/.incoming/'*"
          scp -i ~/.ssh/agento_deploy_key -P "$VPS_PORT" deploy/app.jar deploy/app.env deploy/agento-bot-status.sh deploy/agento-bot-stop.sh "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/.incoming/"

      - name: Restart bot on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          : "${VPS_USER:=agento}"
          : "${VPS_PORT:=22}"
          : "${VPS_APP_DIR:=/home/agento/agento-bot}"

          ssh -i ~/.ssh/agento_deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "APP_DIR='$VPS_APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          INCOMING_DIR="$APP_DIR/.incoming"

          [ -f "$INCOMING_DIR/app.jar" ] || { echo "incoming app.jar not found in $INCOMING_DIR"; exit 1; }
          [ -f "$INCOMING_DIR/app.env" ] || { echo "incoming app.env not found in $INCOMING_DIR"; exit 1; }
          [ -f "$INCOMING_DIR/agento-bot-status.sh" ] || { echo "incoming agento-bot-status.sh not found in $INCOMING_DIR"; exit 1; }
          [ -f "$INCOMING_DIR/agento-bot-stop.sh" ] || { echo "incoming agento-bot-stop.sh not found in $INCOMING_DIR"; exit 1; }

          load_user_env() {
            set +e +u
            for file in "$HOME/.profile" "$HOME/.bash_profile" "$HOME/.bashrc"; do
              if [ -f "$file" ]; then
                # shellcheck disable=SC1090
                . "$file"
              fi
            done
            if [ -s "$HOME/.sdkman/bin/sdkman-init.sh" ]; then
              # shellcheck disable=SC1091
              . "$HOME/.sdkman/bin/sdkman-init.sh"
            fi
            set -euo pipefail
          }

          set -a
          # shellcheck disable=SC1091
          source "$INCOMING_DIR/app.env"
          set +a

          load_user_env

          JAVA_COMMAND="${JAVA_COMMAND:-java}"
          if ! command -v "$JAVA_COMMAND" >/dev/null 2>&1; then
            FOUND_JAVA=$(find "$HOME" /usr/lib/jvm -type f -path '*/bin/java' -perm -111 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_JAVA" ]; then
              JAVA_COMMAND="$FOUND_JAVA"
            fi
          fi

          if [ "${CODEX_COMMAND:-codex}" = "codex" ] && ! command -v codex >/dev/null 2>&1; then
            FOUND_CODEX=$(find "$HOME" -type f -path '*/bin/codex' 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_CODEX" ]; then
              export CODEX_COMMAND="$FOUND_CODEX"
            fi
          fi
          if [ "${CODEX_COMMAND:-codex}" != "codex" ] && [ -f "$CODEX_COMMAND" ]; then
            export PATH="$(dirname "$CODEX_COMMAND"):$PATH"
          fi

          "$JAVA_COMMAND" -version >/dev/null 2>&1 || { echo "Java is not available in this non-interactive SSH session"; echo "PATH=$PATH"; exit 1; }
          "$CODEX_COMMAND" --version >/dev/null 2>&1 || { echo "Codex CLI is not available. Install or authenticate it on VPS first."; echo "PATH=$PATH"; exit 1; }

          LEGACY_APP_DIR="$HOME"
          if [ "$LEGACY_APP_DIR" != "$APP_DIR" ] && [ -f "$LEGACY_APP_DIR/app.pid" ]; then
            LEGACY_PID=$(cat "$LEGACY_APP_DIR/app.pid" || true)
            if [ -n "${LEGACY_PID:-}" ] && ps -p "$LEGACY_PID" >/dev/null 2>&1; then
              kill "$LEGACY_PID" || true
              sleep 2
            fi
            if [ -n "${LEGACY_PID:-}" ] && ps -p "$LEGACY_PID" >/dev/null 2>&1; then
              kill -9 "$LEGACY_PID" || true
            fi
          fi
          if [ "$LEGACY_APP_DIR" != "$APP_DIR" ]; then
            rm -f "$LEGACY_APP_DIR/app.jar" \
                  "$LEGACY_APP_DIR/app.env" \
                  "$LEGACY_APP_DIR/app.log" \
                  "$LEGACY_APP_DIR/app.pid" \
                  "$LEGACY_APP_DIR/agento-bot-status.sh" \
                  "$LEGACY_APP_DIR/agento-bot-stop.sh"
          fi

          if [ -f app.pid ]; then
            OLD_PID=$(cat app.pid || true)
            if [ -n "${OLD_PID:-}" ] && ps -p "$OLD_PID" >/dev/null 2>&1; then
              kill "$OLD_PID" || true
              sleep 2
            fi
            if [ -n "${OLD_PID:-}" ] && ps -p "$OLD_PID" >/dev/null 2>&1; then
              kill -9 "$OLD_PID" || true
            fi
            rm -f app.pid
          fi

          rm -f app.jar app.env agento-bot-status.sh agento-bot-stop.sh app.log app.pid
          mv "$INCOMING_DIR/app.jar" app.jar
          mv "$INCOMING_DIR/app.env" app.env
          mv "$INCOMING_DIR/agento-bot-status.sh" agento-bot-status.sh
          mv "$INCOMING_DIR/agento-bot-stop.sh" agento-bot-stop.sh
          chmod +x agento-bot-status.sh agento-bot-stop.sh

          nohup "$JAVA_COMMAND" -jar app.jar > app.log 2>&1 &
          echo $! > app.pid
          sleep 3

          if ! ps -p "$(cat app.pid)" >/dev/null 2>&1; then
            echo "Bot failed to start. Last logs:"
            tail -n 100 app.log || true
            exit 1
          fi

          echo "Agento bot started. PID=$(cat app.pid)"
          REMOTE
