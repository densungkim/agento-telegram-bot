name: Build and deploy Agento Bot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agento-bot-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Maven 3.9.16
        run: |
          set -euo pipefail
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz -o /tmp/apache-maven.tar.gz
          tar -xzf /tmp/apache-maven.tar.gz -C /tmp
          echo "/tmp/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"

      - name: Build jar
        run: |
          mvn -version
          mvn -B clean package -Dmaven.test.skip=true

      - name: Prepare SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/agento_deploy_key
          chmod 600 ~/.ssh/agento_deploy_key

          if [ -z "${VPS_PORT:-}" ]; then
            VPS_PORT=22
          fi

          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Prepare deployment files
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
          TELEGRAM_MESSAGE_MAX_LENGTH: ${{ secrets.TELEGRAM_MESSAGE_MAX_LENGTH }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CONFIG_DIR: ${{ secrets.CLAUDE_CONFIG_DIR }}
          CLAUDE_COMMAND: ${{ secrets.CLAUDE_COMMAND }}
          CLAUDE_WORKDIR: ${{ secrets.CLAUDE_WORKDIR }}
          CLAUDE_TIMEOUT_SECONDS: ${{ secrets.CLAUDE_TIMEOUT_SECONDS }}
          CLAUDE_MAX_OUTPUT_CHARS: ${{ secrets.CLAUDE_MAX_OUTPUT_CHARS }}
          CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
          CLAUDE_EFFORT: ${{ secrets.CLAUDE_EFFORT }}
          CLAUDE_ACCESS_MODE: ${{ secrets.CLAUDE_ACCESS_MODE }}
          CLAUDE_SETTINGS_FILE: ${{ secrets.CLAUDE_SETTINGS_FILE }}
          CLAUDE_SESSION_FILE: ${{ secrets.CLAUDE_SESSION_FILE }}
          CLAUDE_ALLOWED_MODELS: ${{ secrets.CLAUDE_ALLOWED_MODELS }}
          CLAUDE_ALLOWED_EFFORTS: ${{ secrets.CLAUDE_ALLOWED_EFFORTS }}
          CLAUDE_ALLOWED_ACCESS_MODES: ${{ secrets.CLAUDE_ALLOWED_ACCESS_MODES }}
          CLAUDE_SYSTEM_PROMPT: ${{ secrets.CLAUDE_SYSTEM_PROMPT }}
        run: |
          set -euo pipefail
          mkdir -p deploy
          cp target/agento-telegram-bot-0.0.1-SNAPSHOT.jar deploy/app.jar
          cp scripts/agento-bot-status.sh deploy/agento-bot-status.sh
          cp scripts/agento-bot-stop.sh deploy/agento-bot-stop.sh
          cp scripts/claude-version.txt deploy/claude-version.txt

          : "${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN secret is required}"
          : "${TELEGRAM_ALLOWED_CHAT_ID:?TELEGRAM_ALLOWED_CHAT_ID secret is required}"
          : "${CLAUDE_CODE_OAUTH_TOKEN:?CLAUDE_CODE_OAUTH_TOKEN secret is required (claude setup-token)}"
          : "${TELEGRAM_MESSAGE_MAX_LENGTH:=3900}"

          : "${CLAUDE_COMMAND:=claude}"
          : "${CLAUDE_WORKDIR:=/home/agento}"
          : "${CLAUDE_TIMEOUT_SECONDS:=900}"
          : "${CLAUDE_MAX_OUTPUT_CHARS:=30000}"
          : "${CLAUDE_MODEL:=default}"
          : "${CLAUDE_EFFORT:=default}"
          : "${CLAUDE_ACCESS_MODE:=full-access}"
          : "${CLAUDE_SETTINGS_FILE:=./agento-settings.properties}"
          : "${CLAUDE_SESSION_FILE:=./agento-session.properties}"
          : "${CLAUDE_ALLOWED_MODELS:=default,opus,sonnet,haiku,fable}"
          : "${CLAUDE_ALLOWED_EFFORTS:=default,low,medium,high,xhigh,max}"
          : "${CLAUDE_ALLOWED_ACCESS_MODES:=read-only,workspace,full-access}"

          write_env() {
            local key="$1"
            local value="${!key:-}"
            printf '%s=%q\n' "$key" "$value" >> deploy/app.env
          }

          : > deploy/app.env
          chmod 600 deploy/app.env
          write_env TELEGRAM_BOT_TOKEN
          write_env TELEGRAM_ALLOWED_CHAT_ID
          write_env TELEGRAM_MESSAGE_MAX_LENGTH
          write_env CLAUDE_CODE_OAUTH_TOKEN
          write_env CLAUDE_COMMAND
          write_env CLAUDE_WORKDIR
          write_env CLAUDE_TIMEOUT_SECONDS
          write_env CLAUDE_MAX_OUTPUT_CHARS
          write_env CLAUDE_MODEL
          write_env CLAUDE_EFFORT
          write_env CLAUDE_ACCESS_MODE
          write_env CLAUDE_SETTINGS_FILE
          write_env CLAUDE_SESSION_FILE
          write_env CLAUDE_ALLOWED_MODELS
          write_env CLAUDE_ALLOWED_EFFORTS
          write_env CLAUDE_ALLOWED_ACCESS_MODES
          if [ -n "${CLAUDE_CONFIG_DIR:-}" ]; then
            write_env CLAUDE_CONFIG_DIR
          fi
          if [ -n "${CLAUDE_SYSTEM_PROMPT:-}" ]; then
            write_env CLAUDE_SYSTEM_PROMPT
          fi

          # Read by the Claude Code CLI itself: keep the installed version until it is updated deliberately.
          # Do not add CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: it forces the permission mode to default.
          printf '%s=%q\n' DISABLE_AUTOUPDATER 1 >> deploy/app.env

      - name: Copy files to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          : "${VPS_USER:=agento}"
          : "${VPS_PORT:=22}"
          : "${VPS_APP_DIR:=/home/agento/agento-bot}"

          ssh -i ~/.ssh/agento_deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_APP_DIR/.incoming' && rm -f '$VPS_APP_DIR/.incoming/'*"
          scp -i ~/.ssh/agento_deploy_key -P "$VPS_PORT" deploy/app.jar deploy/app.env deploy/agento-bot-status.sh deploy/agento-bot-stop.sh deploy/claude-version.txt "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/.incoming/"

      - name: Restart bot on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          : "${VPS_USER:=agento}"
          : "${VPS_PORT:=22}"
          : "${VPS_APP_DIR:=/home/agento/agento-bot}"

          ssh -i ~/.ssh/agento_deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "APP_DIR='$VPS_APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          APP_DIR=$(pwd -P)
          INCOMING_DIR="$APP_DIR/.incoming"

          [ -f "$INCOMING_DIR/app.jar" ] || { echo "incoming app.jar not found in $INCOMING_DIR"; exit 1; }
          [ -f "$INCOMING_DIR/app.env" ] || { echo "incoming app.env not found in $INCOMING_DIR"; exit 1; }
          [ -f "$INCOMING_DIR/agento-bot-status.sh" ] || { echo "incoming agento-bot-status.sh not found in $INCOMING_DIR"; exit 1; }
          [ -f "$INCOMING_DIR/agento-bot-stop.sh" ] || { echo "incoming agento-bot-stop.sh not found in $INCOMING_DIR"; exit 1; }
          [ -f "$INCOMING_DIR/claude-version.txt" ] || { echo "incoming claude-version.txt not found in $INCOMING_DIR"; exit 1; }

          load_user_env() {
            set +e +u
            for file in "$HOME/.profile" "$HOME/.bash_profile" "$HOME/.bashrc"; do
              if [ -f "$file" ]; then
                # shellcheck disable=SC1090
                . "$file"
              fi
            done
            if [ -s "$HOME/.sdkman/bin/sdkman-init.sh" ]; then
              # shellcheck disable=SC1091
              . "$HOME/.sdkman/bin/sdkman-init.sh"
            fi
            set -euo pipefail
          }

          load_user_env
          cd "$APP_DIR"

          set -a
          # shellcheck disable=SC1091
          source "$INCOMING_DIR/app.env"
          set +a

          JAVA_COMMAND="${JAVA_COMMAND:-java}"
          if ! command -v "$JAVA_COMMAND" >/dev/null 2>&1; then
            FOUND_JAVA=$(find "$HOME" /usr/lib/jvm -type f -path '*/bin/java' -perm -111 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_JAVA" ]; then
              JAVA_COMMAND="$FOUND_JAVA"
            fi
          fi

          # The native installer puts the launcher into ~/.local/bin, which a non-interactive SSH session may not have in PATH.
          if [ "${CLAUDE_COMMAND:-claude}" = "claude" ] && ! command -v claude >/dev/null 2>&1 && [ -x "$HOME/.local/bin/claude" ]; then
            export CLAUDE_COMMAND="$HOME/.local/bin/claude"
          fi
          if [ "${CLAUDE_COMMAND:-claude}" != "claude" ] && [ -f "$CLAUDE_COMMAND" ]; then
            export PATH="$(dirname "$CLAUDE_COMMAND"):$PATH"
          fi

          JAVA_VERSION_OUTPUT=$("$JAVA_COMMAND" -version 2>&1) || { echo "Java is not available in this non-interactive SSH session"; echo "PATH=$PATH"; exit 1; }
          if [[ ! "$JAVA_VERSION_OUTPUT" =~ version[[:space:]]+\"([0-9]+) ]]; then
            echo "Cannot determine Java version: $JAVA_VERSION_OUTPUT"
            exit 1
          fi
          JAVA_MAJOR_VERSION="${BASH_REMATCH[1]}"
          if (( JAVA_MAJOR_VERSION < 25 )); then
            echo "Java 25 or newer is required; found Java $JAVA_MAJOR_VERSION. Java 25 LTS is recommended."
            exit 1
          fi

          [ "$(id -u)" -ne 0 ] || { echo "The bot must not run as root: Claude Code refuses bypassPermissions for root."; exit 1; }

          CLAUDE_VERSION_OUTPUT=$("$CLAUDE_COMMAND" --version) || { echo "Claude Code is not available. Run scripts/install-claude-on-vps.sh as the bot user first."; echo "PATH=$PATH"; exit 1; }
          if [[ ! "$CLAUDE_VERSION_OUTPUT" =~ ^([0-9]+\.[0-9]+\.[0-9]+)[[:space:]]+\(Claude\ Code\)$ ]]; then
            echo "Cannot determine the Claude Code version: $CLAUDE_VERSION_OUTPUT"
            exit 1
          fi
          INSTALLED_CLAUDE_VERSION="${BASH_REMATCH[1]}"
          REQUIRED_CLAUDE_VERSION=$(tr -d '\r\n' < "$INCOMING_DIR/claude-version.txt")
          if [[ ! "$REQUIRED_CLAUDE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid minimum Claude Code version in claude-version.txt"
            exit 1
          fi
          LOWEST_CLAUDE_VERSION=$(printf '%s\n' "$REQUIRED_CLAUDE_VERSION" "$INSTALLED_CLAUDE_VERSION" | sort -V | head -n 1)
          if [ "$LOWEST_CLAUDE_VERSION" != "$REQUIRED_CLAUDE_VERSION" ]; then
            echo "Claude Code $REQUIRED_CLAUDE_VERSION or newer is required; found $INSTALLED_CLAUDE_VERSION."
            echo "Run 'claude update' or scripts/install-claude-on-vps.sh from the updated repository as the bot user."
            exit 1
          fi

          # Same environment as the bot: the token from app.env, without an API key that would win over it.
          env -u ANTHROPIC_API_KEY "$CLAUDE_COMMAND" auth status >/dev/null 2>&1 || { echo "Claude Code is not authenticated with CLAUDE_CODE_OAUTH_TOKEN. Create a token with 'claude setup-token' and update the secret."; exit 1; }
          [ -d "$CLAUDE_WORKDIR" ] && [ -x "$CLAUDE_WORKDIR" ] || { echo "CLAUDE_WORKDIR is not accessible to the bot user: $CLAUDE_WORKDIR"; exit 1; }
          if [[ ",$CLAUDE_ALLOWED_ACCESS_MODES," == *",workspace,"* ]]; then
            for tool in bwrap socat; do
              command -v "$tool" >/dev/null 2>&1 || echo "WARNING: $tool is missing; tasks in the workspace access mode will fail until bubblewrap and socat are installed."
            done
          fi

          LEGACY_APP_DIR="$HOME"
          if [ "$LEGACY_APP_DIR" != "$APP_DIR" ] && [ -f "$LEGACY_APP_DIR/app.pid" ]; then
            APP_DIR="$LEGACY_APP_DIR" bash "$INCOMING_DIR/agento-bot-stop.sh"
            echo "Legacy runtime stopped; files in $LEGACY_APP_DIR are preserved."
          fi

          APP_DIR="$APP_DIR" bash "$INCOMING_DIR/agento-bot-stop.sh"

          rm -f app.jar app.env agento-bot-status.sh agento-bot-stop.sh app.log app.pid codex-version.txt
          mv "$INCOMING_DIR/app.jar" app.jar
          mv "$INCOMING_DIR/app.env" app.env
          mv "$INCOMING_DIR/agento-bot-status.sh" agento-bot-status.sh
          mv "$INCOMING_DIR/agento-bot-stop.sh" agento-bot-stop.sh
          mv "$INCOMING_DIR/claude-version.txt" claude-version.txt
          chmod 600 app.env
          chmod +x agento-bot-status.sh agento-bot-stop.sh

          nohup "$JAVA_COMMAND" -jar "$APP_DIR/app.jar" > app.log 2>&1 &
          echo $! > app.pid
          NEW_PID=$(cat app.pid)
          READY=false
          for attempt in {1..75}; do
            kill -0 "$NEW_PID" 2>/dev/null || break
            if grep -qF 'AGENTO_TELEGRAM_READY' app.log; then
              READY=true
              break
            fi
            sleep 2
          done

          if [ "$READY" != true ]; then
            echo "Bot did not confirm Telegram polling readiness within 150 seconds. Last logs:"
            tail -n 100 app.log || true
            exit 1
          fi

          echo "Agento bot is receiving Telegram updates. PID=$NEW_PID"
          REMOTE
