name: Build and deploy Agento Bot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agento-bot-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Maven 3.9.16
        run: |
          set -euo pipefail
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz -o /tmp/apache-maven.tar.gz
          tar -xzf /tmp/apache-maven.tar.gz -C /tmp
          echo "/tmp/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"

      - name: Build jar
        run: |
          mvn -version
          mvn -B clean package -Dmaven.test.skip=true

      - name: Prepare SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/agento_deploy_key
          chmod 600 ~/.ssh/agento_deploy_key

          if [ -z "${VPS_PORT:-}" ]; then
            VPS_PORT=22
          fi

          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Prepare deployment files
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
          TELEGRAM_MESSAGE_MAX_LENGTH: ${{ secrets.TELEGRAM_MESSAGE_MAX_LENGTH }}
          CODEX_COMMAND: ${{ secrets.CODEX_COMMAND }}
          CODEX_WORKDIR: ${{ secrets.CODEX_WORKDIR }}
          CODEX_TIMEOUT_SECONDS: ${{ secrets.CODEX_TIMEOUT_SECONDS }}
          CODEX_MAX_OUTPUT_CHARS: ${{ secrets.CODEX_MAX_OUTPUT_CHARS }}
          CODEX_MODEL: ${{ secrets.CODEX_MODEL }}
          CODEX_REASONING_EFFORT: ${{ secrets.CODEX_REASONING_EFFORT }}
          CODEX_ACCESS_MODE: ${{ secrets.CODEX_ACCESS_MODE }}
          CODEX_SETTINGS_FILE: ${{ secrets.CODEX_SETTINGS_FILE }}
          CODEX_SESSION_FILE: ${{ secrets.CODEX_SESSION_FILE }}
          CODEX_AUTH_MODE: ${{ secrets.CODEX_AUTH_MODE }}
          CODEX_MODEL_CATALOG_FILE: ${{ secrets.CODEX_MODEL_CATALOG_FILE }}
          CODEX_ALLOWED_MODELS: ${{ secrets.CODEX_ALLOWED_MODELS }}
          CODEX_ALLOWED_REASONING_EFFORTS: ${{ secrets.CODEX_ALLOWED_REASONING_EFFORTS }}
          CODEX_ALLOWED_ACCESS_MODES: ${{ secrets.CODEX_ALLOWED_ACCESS_MODES }}
          CODEX_SYSTEM_PROMPT: ${{ secrets.CODEX_SYSTEM_PROMPT }}
        run: |
          set -euo pipefail
          mkdir -p deploy
          cp target/agento-telegram-bot-0.0.1-SNAPSHOT.jar deploy/app.jar
          cp scripts/agento-bot-status.sh deploy/agento-bot-status.sh
          cp scripts/agento-bot-stop.sh deploy/agento-bot-stop.sh
          cp scripts/codex-version.txt deploy/codex-version.txt

          : "${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN secret is required}"
          : "${TELEGRAM_ALLOWED_CHAT_ID:?TELEGRAM_ALLOWED_CHAT_ID secret is required}"
          : "${TELEGRAM_MESSAGE_MAX_LENGTH:=3900}"

          : "${CODEX_COMMAND:=codex}"
          : "${CODEX_WORKDIR:=/home/agento}"
          : "${CODEX_TIMEOUT_SECONDS:=900}"
          : "${CODEX_MAX_OUTPUT_CHARS:=30000}"
          : "${CODEX_MODEL:=default}"
          : "${CODEX_REASONING_EFFORT:=default}"
          : "${CODEX_ACCESS_MODE:=full-access}"
          : "${CODEX_SETTINGS_FILE:=./agento-settings.properties}"
          : "${CODEX_SESSION_FILE:=./agento-session.properties}"
          : "${CODEX_AUTH_MODE:=chatgpt}"
          : "${CODEX_ALLOWED_ACCESS_MODES:=read-only,workspace,full-access}"

          write_env() {
            local key="$1"
            local value="${!key:-}"
            printf '%s=%q\n' "$key" "$value" >> deploy/app.env
          }

          : > deploy/app.env
          write_env TELEGRAM_BOT_TOKEN
          write_env TELEGRAM_ALLOWED_CHAT_ID
          write_env TELEGRAM_MESSAGE_MAX_LENGTH
          write_env CODEX_COMMAND
          write_env CODEX_WORKDIR
          write_env CODEX_TIMEOUT_SECONDS
          write_env CODEX_MAX_OUTPUT_CHARS
          write_env CODEX_MODEL
          write_env CODEX_REASONING_EFFORT
          write_env CODEX_ACCESS_MODE
          write_env CODEX_SETTINGS_FILE
          write_env CODEX_SESSION_FILE
          write_env CODEX_AUTH_MODE
          write_env CODEX_MODEL_CATALOG_FILE
          write_env CODEX_ALLOWED_MODELS
          write_env CODEX_ALLOWED_REASONING_EFFORTS
          write_env CODEX_ALLOWED_ACCESS_MODES
          if [ -n "${CODEX_SYSTEM_PROMPT:-}" ]; then
            write_env CODEX_SYSTEM_PROMPT
          fi

          printf '%s=%q\n' CODEX_SKIP_GIT_REPO_CHECK true >> deploy/app.env

      - name: Copy files to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          : "${VPS_USER:=agento}"
          : "${VPS_PORT:=22}"
          : "${VPS_APP_DIR:=/home/agento/agento-bot}"

          ssh -i ~/.ssh/agento_deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_APP_DIR/.incoming' && rm -f '$VPS_APP_DIR/.incoming/'*"
          scp -i ~/.ssh/agento_deploy_key -P "$VPS_PORT" deploy/app.jar deploy/app.env deploy/agento-bot-status.sh deploy/agento-bot-stop.sh deploy/codex-version.txt "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/.incoming/"

      - name: Restart bot on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          : "${VPS_USER:=agento}"
          : "${VPS_PORT:=22}"
          : "${VPS_APP_DIR:=/home/agento/agento-bot}"

          ssh -i ~/.ssh/agento_deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "APP_DIR='$VPS_APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          APP_DIR=$(pwd -P)
          INCOMING_DIR="$APP_DIR/.incoming"

          [ -f "$INCOMING_DIR/app.jar" ] || { echo "incoming app.jar not found in $INCOMING_DIR"; exit 1; }
          [ -f "$INCOMING_DIR/app.env" ] || { echo "incoming app.env not found in $INCOMING_DIR"; exit 1; }
          [ -f "$INCOMING_DIR/agento-bot-status.sh" ] || { echo "incoming agento-bot-status.sh not found in $INCOMING_DIR"; exit 1; }
          [ -f "$INCOMING_DIR/agento-bot-stop.sh" ] || { echo "incoming agento-bot-stop.sh not found in $INCOMING_DIR"; exit 1; }
          [ -f "$INCOMING_DIR/codex-version.txt" ] || { echo "incoming codex-version.txt not found in $INCOMING_DIR"; exit 1; }

          load_user_env() {
            set +e +u
            for file in "$HOME/.profile" "$HOME/.bash_profile" "$HOME/.bashrc"; do
              if [ -f "$file" ]; then
                # shellcheck disable=SC1090
                . "$file"
              fi
            done
            if [ -s "$HOME/.sdkman/bin/sdkman-init.sh" ]; then
              # shellcheck disable=SC1091
              . "$HOME/.sdkman/bin/sdkman-init.sh"
            fi
            set -euo pipefail
          }

          load_user_env
          cd "$APP_DIR"

          set -a
          # shellcheck disable=SC1091
          source "$INCOMING_DIR/app.env"
          set +a

          JAVA_COMMAND="${JAVA_COMMAND:-java}"
          if ! command -v "$JAVA_COMMAND" >/dev/null 2>&1; then
            FOUND_JAVA=$(find "$HOME" /usr/lib/jvm -type f -path '*/bin/java' -perm -111 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_JAVA" ]; then
              JAVA_COMMAND="$FOUND_JAVA"
            fi
          fi

          if [ "${CODEX_COMMAND:-codex}" = "codex" ] && ! command -v codex >/dev/null 2>&1; then
            FOUND_CODEX=$(find "$HOME" \( -type f -o -type l \) -path '*/bin/codex' -executable 2>/dev/null | sort -V | tail -n 1 || true)
            if [ -n "$FOUND_CODEX" ]; then
              export CODEX_COMMAND="$FOUND_CODEX"
            fi
          fi
          if [ "${CODEX_COMMAND:-codex}" != "codex" ] && [ -f "$CODEX_COMMAND" ]; then
            export PATH="$(dirname "$CODEX_COMMAND"):$PATH"
          fi

          JAVA_VERSION_OUTPUT=$("$JAVA_COMMAND" -version 2>&1) || { echo "Java is not available in this non-interactive SSH session"; echo "PATH=$PATH"; exit 1; }
          if [[ ! "$JAVA_VERSION_OUTPUT" =~ version[[:space:]]+\"([0-9]+) ]]; then
            echo "Cannot determine Java version: $JAVA_VERSION_OUTPUT"
            exit 1
          fi
          JAVA_MAJOR_VERSION="${BASH_REMATCH[1]}"
          if (( JAVA_MAJOR_VERSION < 25 )); then
            echo "Java 25 or newer is required; found Java $JAVA_MAJOR_VERSION. Java 25 LTS is recommended."
            exit 1
          fi

          CODEX_VERSION_OUTPUT=$("$CODEX_COMMAND" --version) || { echo "Codex CLI is not available. Install it on VPS first."; echo "PATH=$PATH"; exit 1; }
          if [[ ! "$CODEX_VERSION_OUTPUT" =~ ^codex-cli[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "A stable Codex CLI release is required; found: $CODEX_VERSION_OUTPUT"
            exit 1
          fi
          INSTALLED_CODEX_VERSION="${BASH_REMATCH[1]}"
          REQUIRED_CODEX_VERSION=$(tr -d '\r\n' < "$INCOMING_DIR/codex-version.txt")
          if [[ ! "$REQUIRED_CODEX_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid minimum Codex version in codex-version.txt"
            exit 1
          fi
          LOWEST_CODEX_VERSION=$(printf '%s\n' "$REQUIRED_CODEX_VERSION" "$INSTALLED_CODEX_VERSION" | sort -V | head -n 1)
          if [ "$LOWEST_CODEX_VERSION" != "$REQUIRED_CODEX_VERSION" ]; then
            echo "Codex CLI $REQUIRED_CODEX_VERSION or newer is required; found $INSTALLED_CODEX_VERSION."
            echo "Run scripts/install-codex-on-vps.sh from the updated repository as the bot user."
            exit 1
          fi

          "$CODEX_COMMAND" login status >/dev/null 2>&1 || { echo "Codex is not authenticated for this VPS user. Run codex login as the bot user first."; exit 1; }
          [ -d "$CODEX_WORKDIR" ] && [ -x "$CODEX_WORKDIR" ] || { echo "CODEX_WORKDIR is not accessible to the bot user: $CODEX_WORKDIR"; exit 1; }
          case "$CODEX_AUTH_MODE" in
            chatgpt|api-key) ;;
            *) echo "CODEX_AUTH_MODE must be chatgpt or api-key"; exit 1 ;;
          esac
          if [ -n "${CODEX_MODEL_CATALOG_FILE:-}" ]; then
            [ -f "$CODEX_MODEL_CATALOG_FILE" ] && [ -r "$CODEX_MODEL_CATALOG_FILE" ] || { echo "CODEX_MODEL_CATALOG_FILE is not readable: $CODEX_MODEL_CATALOG_FILE"; exit 1; }
          fi

          LEGACY_APP_DIR="$HOME"
          if [ "$LEGACY_APP_DIR" != "$APP_DIR" ] && [ -f "$LEGACY_APP_DIR/app.pid" ]; then
            APP_DIR="$LEGACY_APP_DIR" bash "$INCOMING_DIR/agento-bot-stop.sh"
            echo "Legacy runtime stopped; files in $LEGACY_APP_DIR are preserved."
          fi

          APP_DIR="$APP_DIR" bash "$INCOMING_DIR/agento-bot-stop.sh"

          rm -f app.jar app.env agento-bot-status.sh agento-bot-stop.sh app.log app.pid
          mv "$INCOMING_DIR/app.jar" app.jar
          mv "$INCOMING_DIR/app.env" app.env
          mv "$INCOMING_DIR/agento-bot-status.sh" agento-bot-status.sh
          mv "$INCOMING_DIR/agento-bot-stop.sh" agento-bot-stop.sh
          mv "$INCOMING_DIR/codex-version.txt" codex-version.txt
          chmod +x agento-bot-status.sh agento-bot-stop.sh

          nohup "$JAVA_COMMAND" -jar "$APP_DIR/app.jar" > app.log 2>&1 &
          echo $! > app.pid
          NEW_PID=$(cat app.pid)
          READY=false
          for attempt in {1..75}; do
            kill -0 "$NEW_PID" 2>/dev/null || break
            if grep -qF 'AGENTO_TELEGRAM_READY' app.log; then
              READY=true
              break
            fi
            sleep 2
          done

          if [ "$READY" != true ]; then
            echo "Bot did not confirm Telegram polling readiness within 150 seconds. Last logs:"
            tail -n 100 app.log || true
            exit 1
          fi

          echo "Agento bot is receiving Telegram updates. PID=$NEW_PID"
          REMOTE
